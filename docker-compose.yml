# ==============================================================================
# Docker Compose Configuration - DEVELOPMENT
# English Teacher Academy - Optimized for Local Development
# ==============================================================================

version: '3.9'

services:
  # =============================================================================
  # PostgreSQL Database Service
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: englishteacher_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-englishteacher_db}
      POSTGRES_USER: ${POSTGRES_USER:-englishteacher_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englishteacher_user} -d ${POSTGRES_DB:-englishteacher_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Django Application Service
  # =============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      cache_from:
        - englishteacher_web:latest
    image: englishteacher_web:dev
    container_name: englishteacher_web_dev
    restart: unless-stopped
    environment:
      # Django Core Settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_SETTINGS_MODULE: EnglishTeacher.dev_settings
      
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-englishteacher_user}:${POSTGRES_PASSWORD:-secure_password_change_me}@db:5432/${POSTGRES_DB:-englishteacher_db}
      
      # Cache Configuration (Disabled for Development)
      CACHE_BACKEND: ${CACHE_BACKEND:-django.core.cache.backends.dummy.DummyCache}
      
      # Email Configuration (Console backend for development)
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@academy.com}
      
      # Security Settings - Development (Relaxed)
      SECURE_SSL_REDIRECT: False
      SECURE_HSTS_SECONDS: 0
      SECURE_HSTS_INCLUDE_SUBDOMAINS: False
      SECURE_HSTS_PRELOAD: False
      SECURE_BROWSER_XSS_FILTER: False
      SECURE_CONTENT_TYPE_NOSNIFF: False
      
      # Session Security
      SESSION_COOKIE_SECURE: False
      SESSION_COOKIE_HTTPONLY: True
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-3600}
      
      # CSRF Security
      CSRF_COOKIE_SECURE: False
      CSRF_COOKIE_HTTPONLY: True
      CSRF_COOKIE_SAMESITE: Lax
      
      # Rate Limiting (Disabled for Development)
      RATELIMIT_ENABLE: ${RATELIMIT_ENABLE:-False}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-DEBUG}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-INFO}
      
      # Internationalization
      LANGUAGE_CODE: fa
      TIME_ZONE: Asia/Tehran
      USE_I18N: True
      USE_TZ: True
      
      # Development Mode
      DEVELOPMENT_MODE: True
      
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/", "--max-time", "10"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # =============================================================================
  # Nginx Reverse Proxy Service (Optional for Development)
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: englishteacher_nginx_dev
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - with-nginx  # Only start with: docker-compose --profile with-nginx up

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  app_network:
    driver: bridge
