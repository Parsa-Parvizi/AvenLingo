# =============================================================================
# Django Application Server Configuration
# English Teacher Academy - Application Proxy and Static Files
# =============================================================================

# Upstream Django application
upstream django_app {
    server web:8000;
}

# =============================================================================
# HTTP Server - HTTPS Disabled
# =============================================================================
server {
    listen 80;
    server_name _;  # Replace with your domain: englishteacher.academy
    
    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy to Django (HTTP only)
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
    }

    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Enable gzip for static files
        location ~* \.(css|js)$ {
            gzip_static on;
            expires 1y;
        }
    }

    # Media files
    location /media/ {
        alias /var/www/media/;
        expires 1M;
        add_header Cache-Control "public";
        
        # Prevent execution of uploaded files
        location ~* \.(php|py|pl|sh|cgi)$ {
            return 403;
        }
    }
}

