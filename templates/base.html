{% load static %} {% load tz %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <link rel="preload" href="{% static 'fonts/Vazir.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'css/framework.css' %}" as="style">
    <link rel="preload" href="{% static 'css/main.css' %}" as="style">
    <link rel="preload" href="{% static 'js/main.js' %}" as="script">
    
    <meta name="keywords" content="آوان,کلاس زبان,آموزش زبان انگلیسی, دوره‌های زبان, مبینا گرشاسبی"/>
    <meta name="description" content="وبسایت رسمی آموزشگاه آوان - آموزش زبان انگلیسی به صورت تخصصی و کلاس‌های آنلاین و حضوری"/>
    <meta name="author" content="مبینا گرشاسبی" />

    <title>ALA{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/framework.css' %}" />
    <link rel="stylesheet" href="{% static 'css/icons.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}" />
    <link rel="stylesheet" href="{% static 'css/universal-font.css' %}" />
    
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'css/slide.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'css/search.css' %}" />
    <link rel="stylesheet" href="{% static 'css/teacher.css' %}" />
    <link rel="stylesheet" href="{% static 'css/course.css' %}" />
    <link rel="stylesheet" href="{% static 'css/faq.css' %}" />
    <link rel="stylesheet" href="{% static 'css/mobile.css' %}" />

    <link rel="stylesheet" href="{% static 'css/aboutus.css' %}" />
    <link rel="stylesheet" href="{% static 'css/contactus.css' %}" />

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <link rel="stylesheet" href="{% static 'css/class-room.css' %}" />
    <link rel="stylesheet" href="{% static 'css/aboutus.css' %}" />
    <link rel="stylesheet" href="{% static 'css/contactus.css' %}" />
    <link rel="stylesheet" href="{% static 'css/footer.css' %}" />

    {% block extra_meta %}{% endblock %} {% block extra_css %}{% endblock %}

  </head>
  <body>
    {% include 'navbar.html' %}

    <main class="content">{% block content %}{% endblock %}</main>

    {% include 'footer.html' %}

    <script src="{% static 'js/charts.js' %}" defer></script>
    <script src="{% static 'js/icon-replacer.js' %}" defer></script>
    <script src="{% static 'js/main.js' %}" defer></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
