{% extends 'base.html' %}
{% load persian_filters %}
{% block title %} | Level Assessment{% endblock %}
{% block content %}
<style>* { font-family: 'Vazir', sans-serif !important; } .determination-form {max-width: 600px; direction: rtl; } .determination-form button { display: block; margin: 0 auto; text-align: center; } .success-message { color: #198754; text-align: center; margin-top: 18px; font-size: 1.1rem; font-family: 'Vazir', sans-serif; } </style>
<div class="page-section">
  <h1>درخواست تعیین سطح</h1>
  <form method="post" enctype="multipart/form-data" class="determination-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">ارسال درخواست</button>
  </form>
  {% if message %}
    <div class="success-message">{{ message }}</div>
  {% endif %}
</div>
{% endblock %}
