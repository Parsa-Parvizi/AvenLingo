{% extends 'base.html' %}
{% block title %}درخواست دوره{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0 text-gradient"><i class="fas fa-clipboard-list me-2"></i>درخواست دوره جدید</h2>
        <a href="{% url 'core:home' %}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-right me-1"></i>بازگشت</a>
      </div>

      <div class="card modern-card">
        <div class="card-body">
          <form method="post" class="row g-3">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i>ثبت درخواست</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.text-gradient{background:linear-gradient(135deg,#1F3A93,#2C3E50);-webkit-background-clip:text;background-clip:text;color:transparent}
.modern-card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.request-course-form p{margin-bottom:1rem}
.request-course-form label{font-weight:600;margin-bottom:.25rem}
.request-course-form input,.request-course-form textarea,.request-course-form select{border:1px solid #e9ecef;border-radius:12px;padding:.6rem .8rem}
</style>
{% endblock %}
